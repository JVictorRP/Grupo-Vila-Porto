<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a0f17">
<title>Kaiken · Ficha em realidade aumentada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
    "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
  }
}
</script>
<style>
  :root{
    --vinho:#2a0f17; --vinho2:#4a1626; --creme:#f4ece0; --ouro:#c9a46a; --tinta:#1a0a0f;
    --serif:"Cormorant Garamond", Georgia, serif; --sans:"Inter", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--vinho);color:var(--creme);font-family:var(--sans);overflow:hidden}
  .tela{position:fixed;inset:0;display:none;flex-direction:column;padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom))}
  .tela.ativa{display:flex}
  #intro{background:radial-gradient(120% 80% at 50% 0%, var(--vinho2) 0%, var(--vinho) 60%, #160609 100%)}
  .selo{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro)}
  .produtor{margin-top:auto;font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.8}
  h1{font-family:var(--serif);font-weight:500;font-size:52px;line-height:.95;margin:6px 0 10px}
  .sub{font-size:15px;opacity:.82;line-height:1.45}
  .passos{margin:28px 0 22px;display:grid;gap:12px}
  .passo{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;opacity:.92}
  .passo b{flex:0 0 24px;height:24px;border-radius:50%;border:1px solid var(--ouro);color:var(--ouro);display:grid;place-items:center;font-size:12px;font-weight:600}
  .btn{appearance:none;border:0;border-radius:999px;padding:17px 22px;font:600 16px var(--sans);width:100%;cursor:pointer}
  .btn.prim{background:var(--creme);color:var(--vinho)}
  .btn.sec{background:transparent;color:var(--creme);border:1px solid rgba(244,236,224,.35);margin-top:10px}
  .link{background:none;border:0;color:var(--creme);opacity:.7;font:500 13px var(--sans);text-decoration:underline;margin-top:14px;cursor:pointer}
  .acoes{display:flex;flex-direction:column;align-items:center}
  /* calibração */
  #calib{background:var(--vinho);justify-content:center;text-align:center}
  #calib h2{font-family:var(--serif);font-weight:500;font-size:36px;margin-bottom:10px}
  #calib p{opacity:.82;line-height:1.5;font-size:15px;max-width:340px;margin:0 auto}
  .moldura{width:62vw;max-width:260px;aspect-ratio:3/4;margin:28px auto;border-radius:18px;border:1.5px dashed rgba(201,164,106,.7);display:grid;place-items:center;overflow:hidden;background:rgba(0,0,0,.18)}
  .moldura img{width:100%;height:100%;object-fit:cover}
  .moldura span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro)}
  .barra{height:4px;background:rgba(244,236,224,.15);border-radius:4px;overflow:hidden;margin:18px auto 8px;max-width:300px;width:100%;display:none}
  .barra i{display:block;height:100%;width:0;background:var(--ouro);transition:width .2s}
  #calibStatus{font-size:13px;opacity:.75;min-height:18px}
  input[type=file]{display:none}
  /* AR */
  #ar{padding:0;background:#000}
  #arContainer{position:absolute;inset:0;overflow:hidden}
  #arContainer video{object-fit:cover}
  .hud{position:absolute;left:0;right:0;z-index:20;pointer-events:none;display:flex;justify-content:center}
  .hud.top{top:max(18px,env(safe-area-inset-top))}
  .pill{pointer-events:auto;background:rgba(26,10,15,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(244,236,224,.18);color:var(--creme);border-radius:999px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ouro);animation:pulse 1.4s infinite}
  .achou .dot{background:#7fd18b;animation:none}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .mira{position:absolute;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center;transition:opacity .4s}
  .mira div{width:58vw;max-width:280px;aspect-ratio:3/4;border-radius:22px;
    background:
      linear-gradient(var(--ouro),var(--ouro)) top left/34px 2px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) top left/2px 34px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) top right/34px 2px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) top right/2px 34px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) bottom left/34px 2px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) bottom left/2px 34px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) bottom right/34px 2px no-repeat,
      linear-gradient(var(--ouro),var(--ouro)) bottom right/2px 34px no-repeat}
  .hud.bottom{bottom:max(22px,env(safe-area-inset-bottom));gap:10px}
  .pill.cta{font-weight:600;padding:13px 20px;background:var(--creme);color:var(--vinho);border:0;opacity:0;transform:translateY(10px);transition:all .35s}
  .pill.cta.on{opacity:1;transform:none}
  .pill.cta.sec{background:rgba(26,10,15,.78);color:var(--creme);border:1px solid rgba(244,236,224,.3)}
  .pill.cta.comprar{background:var(--ouro);color:var(--tinta)}
  .folha .btn.comprar{background:var(--ouro);color:var(--tinta);margin-top:22px}
  .folha .btn.prim.voltar{background:transparent;color:var(--vinho);border:1px solid rgba(42,15,23,.3);margin-top:10px}
  .aviso{background:rgba(42,15,23,.07);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-top:12px;display:none}
  .fechar{position:absolute;z-index:25;top:max(16px,env(safe-area-inset-top));left:16px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,236,224,.25);background:rgba(26,10,15,.6);color:var(--creme);font-size:20px;line-height:1;cursor:pointer}
  /* ficha */
  #ficha{position:fixed;inset:0;z-index:50;background:rgba(10,3,6,.55);display:none;align-items:flex-end}
  #ficha.on{display:flex}
  .folha{width:100%;max-height:88vh;overflow:auto;background:var(--creme);color:var(--tinta);border-radius:22px 22px 0 0;padding:26px 24px max(30px,env(safe-area-inset-bottom));animation:sobe .35s ease}
  @keyframes sobe{from{transform:translateY(40px);opacity:0}}
  .folha .selo{color:#8a6a3a}
  .folha h3{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1;margin:4px 0 6px;color:var(--vinho)}
  .folha .sub{color:#4b3a3f;opacity:1}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:20px 0}
  .grade div small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a3a;margin-bottom:3px}
  .grade div span{font-size:14px;line-height:1.35}
  .bloco{border-top:1px solid rgba(42,15,23,.12);padding-top:14px;margin-top:14px}
  .bloco small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a3a;margin-bottom:6px}
  .bloco p{font-size:14.5px;line-height:1.55}
  .curio{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.4;color:var(--vinho)}
  .folha .btn.prim{background:var(--vinho);color:var(--creme);margin-top:22px}
  .erro{background:#5a1a1a;color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;margin-top:14px;display:none;text-align:left}
  .lista{display:grid;gap:10px;margin:22px 0 20px}
  .item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(244,236,224,.06);border:1px solid rgba(244,236,224,.12)}
  .item .nome{font-family:var(--serif);font-size:26px;line-height:1}
  .item .uva{font-size:12.5px;opacity:.75;margin-top:3px}
  .item .chip{margin-left:auto;font-size:11.5px;font-weight:600;border-radius:999px;padding:8px 12px;border:1px solid rgba(201,164,106,.6);color:var(--ouro);background:none;cursor:pointer;white-space:nowrap}
  .item .chip.ok{background:rgba(127,209,139,.14);border-color:rgba(127,209,139,.5);color:#a8e3b1}
  .btn:disabled{opacity:.4}
</style>
</head>
<body>


<!-- 1. Intro: um QR para todos os rótulos -->
<section id="intro" class="tela ativa">
  <div class="selo">Ficha técnica em realidade aumentada · Piloto</div>
  <div class="produtor">Kaiken</div>
  <h1>Aponte para<br>qualquer rótulo</h1>
  <p class="sub">Um único QR. A câmera reconhece a garrafa e mostra a ficha certa.</p>
  <div class="lista" id="lista"></div>
  <p class="sub" id="dica" style="font-size:12.5px;opacity:.65;margin-bottom:14px"></p>
  <div class="acoes">
    <button class="btn prim" id="btnIniciar">Abrir câmera</button>
    <div class="erro" id="erroIntro"></div>
  </div>
</section>

<!-- 2. Calibração (só no piloto: em loja os rótulos já vêm cadastrados) -->
<section id="calib" class="tela">
  <h2 id="calibTitulo">Ensine o rótulo</h2>
  <p>Fotografe o rótulo de frente, com boa luz e sem reflexo, preenchendo a moldura.</p>
  <div class="moldura" id="moldura"><span>Rótulo aqui</span></div>
  <div class="barra" id="barra"><i></i></div>
  <div id="calibStatus"></div>
  <div class="acoes" style="margin-top:14px">
    <label class="btn prim" id="btnFoto" for="inFoto" style="display:block;text-align:center">Tirar foto do rótulo</label>
    <input type="file" id="inFoto" accept="image/*" capture="environment">
    <button class="link" id="btnVoltar">Voltar</button>
    <div class="erro" id="erroCalib"></div>
  </div>
</section>

<!-- 3. AR -->
<section id="ar" class="tela">
  <div id="arContainer"></div>
  <button class="fechar" id="btnFechar" aria-label="Fechar">×</button>
  <div class="mira" id="mira"><div></div></div>
  <div class="hud top"><div class="pill" id="status"><span class="dot"></span><span id="statusTxt">Iniciando câmera…</span></div></div>
  <div class="hud bottom"><button class="pill cta sec" id="btnFichaAR">Ficha completa</button><button class="pill cta comprar" id="btnComprarAR">Comprar</button></div>
</section>

<!-- Ficha completa -->
<div id="ficha"><div class="folha" id="folha"></div></div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

/* ---------- Fichas (no projeto final, vêm da lista mãe) ---------- */
const VINHOS = {
  mai: {
    produtor: "Kaiken", nome: "Mai", sub: "Malbec · Vistalba, Luján de Cuyo",
    cor: ["#3b0f1d", "#1d070d"],
    grade: [
      ["Uva", "100% Malbec"],
      ["Origem", "Vistalba, Luján de Cuyo · Mendoza, Argentina"],
      ["Vinhedo", "Centenário, plantado em 1910"],
      ["Estágio", "Barricas de carvalho francês"],
      ["Serviço", "17–18 °C · decantar 30 min"],
      ["Guarda", "Vinho de longa evolução"]
    ],
    notas: "Vermelho profundo com reflexos violáceos. Aromas de cassis e cereja com toques de tabaco e especiarias doces. Encorpado, de taninos sedosos e final longo e elegante.",
    harmoniza: "Cortes nobres na brasa, cordeiro, risoto de cogumelos e queijos curados.",
    curio: "“Mai” significa “primeiro” na língua dos Pehuenche, povo originário de Mendoza. É o primeiro vinho ícone da Kaiken.",
    painel: ["Malbec 100%", "Vinhedo de 1910", "17–18 °C", "Carnes na brasa"]
  },
  divina: {
    produtor: "Kaiken", nome: "Divina", sub: "Chardonnay · Los Chacayes, Valle de Uco",
    cor: ["#3a2a12", "#1a1208"],
    grade: [
      ["Uva", "100% Chardonnay"],
      ["Origem", "Los Chacayes, Valle de Uco · Mendoza, Argentina"],
      ["Solo", "Pedregoso, rico em carbonato de cálcio"],
      ["Estágio", "16 meses em barricas francesas de 2º a 4º uso"],
      ["Serviço", "10–12 °C"],
      ["Guarda", "8 a 10 anos"]
    ],
    notas: "Cítricos, frutas brancas e flores delicadas. Textura envolvente, perfil mineral que lembra giz e pedra, e final longo e salino. Referência à finesse de Chablis e à complexidade dos brancos da Borgonha.",
    harmoniza: "Peixes e frutos do mar, aves com molhos cremosos, massas com manteiga e sálvia, queijos de massa mole.",
    curio: "Divina é a nova linha de brancos premium da Kaiken, com enologia de Juan Pablo Solís. A fermentação é lenta, em carvalho francês.",
    painel: ["Chardonnay 100%", "16 meses em barrica", "10–12 °C", "Peixes e aves"]
  }
};

/* ---------- Links de compra: cole aqui o checkout de cada vinho ---------- */
const CHECKOUT = {
  mai: "",     // ex.: https://sualoja.com.br/kaiken-mai
  divina: ""   // ex.: https://sualoja.com.br/kaiken-divina-chardonnay
};

const ORDEM = Object.keys(VINHOS);
const $ = s => document.querySelector(s);
const mostrar = id => document.querySelectorAll(".tela").forEach(t => t.classList.toggle("ativa", t.id === id));
const log = (...a) => console.log("[AR]", ...a);
let atual = null;          // vinho reconhecido agora (ou escolhido)
let editando = null;       // vinho sendo fotografado

/* ---------- Armazenamento local (IndexedDB): fotos dos rótulos + pacote compilado ---------- */
function db(){ return new Promise((ok, err) => { const r = indexedDB.open("ar-piloto-multi", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); }); }
const MEM = {};
async function put(k, v){ MEM[k] = v; try{ const d = await db(); await new Promise((ok,err)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v, k); t.oncomplete=ok; t.onerror=()=>err(t.error); }); }catch(e){ log("sem IndexedDB", e); } }
async function get(k){ if (k in MEM) return MEM[k]; try{ const d = await db(); return await new Promise((ok,err)=>{ const r=d.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>ok(r.result ?? null); r.onerror=()=>err(r.error); }); }catch(e){ return null; } }

/* ---------- Intro: lista de rótulos ---------- */
async function prepararIntro(){
  const fotos = await Promise.all(ORDEM.map(k => get("foto-" + k)));
  const n = fotos.filter(Boolean).length;
  $("#lista").innerHTML = ORDEM.map((k, i) => `
    <div class="item"><div><div class="nome">${VINHOS[k].nome}</div><div class="uva">${VINHOS[k].sub}</div></div>
    <button class="chip ${fotos[i] ? "ok" : ""}" data-k="${k}">${fotos[i] ? "✓ Cadastrado" : "Fotografar rótulo"}</button></div>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => abrirCalib(b.dataset.k));
  $("#btnIniciar").disabled = n === 0;
  $("#dica").textContent = n === 0 ? "Piloto: fotografe cada rótulo uma vez para o sistema aprender. Na loja, os rótulos já vêm cadastrados."
    : n < ORDEM.length ? `${n} de ${ORDEM.length} rótulos cadastrados. Já dá para testar, ou cadastre o outro para ver a troca entre garrafas.`
    : "Tudo pronto. Na câmera, troque de garrafa e veja a ficha mudar. Toque num rótulo cadastrado para refazer a foto.";
}
prepararIntro();
$("#btnIniciar").onclick = async () => { const p = await get("pacote"); if (p) iniciarAR(p); };
$("#btnVoltar").onclick = () => { mostrar("intro"); prepararIntro(); };

/* ---------- Calibração: compila todos os rótulos num único arquivo de reconhecimento ---------- */
function abrirCalib(k){
  editando = k; $("#calibTitulo").textContent = "Rótulo do " + VINHOS[k].nome;
  $("#moldura").innerHTML = "<span>Rótulo aqui</span>"; $("#btnFoto").style.display = "block";
  $("#barra").style.display = "none"; $("#calibStatus").textContent = ""; $("#erroCalib").style.display = "none";
  mostrar("calib");
}
function imgDe(src){ return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error("Não consegui abrir a foto.")); i.src = src; }); }
function reduzir(img, max = 720){
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .92);
}
async function compilarTudo(progresso){
  const chaves = [], imgs = [];
  for (const k of ORDEM){ const f = await get("foto-" + k); if (f){ chaves.push(k); imgs.push(await imgDe(f)); } }
  const { Compiler } = await import("mindar-image");
  const comp = new Compiler();
  await comp.compileImageTargets(imgs, progresso);
  const pacote = { chaves, buf: await comp.exportData() };
  await put("pacote", pacote); log("pacote compilado", chaves.join(","), pacote.buf.byteLength, "bytes");
  return pacote;
}
$("#inFoto").onchange = async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const erro = $("#erroCalib"); erro.style.display = "none";
  try{
    const img = await imgDe(URL.createObjectURL(f));
    $("#moldura").innerHTML = ""; $("#moldura").appendChild(img.cloneNode());
    $("#btnFoto").style.display = "none"; $("#barra").style.display = "block"; $("#barra i").style.width = "0";
    $("#calibStatus").textContent = "Aprendendo os rótulos…";
    await put("foto-" + editando, reduzir(img));
    await compilarTudo(p => { $("#barra i").style.width = Math.min(100, p) + "%"; });
    $("#calibStatus").textContent = "Pronto!";
    setTimeout(() => { mostrar("intro"); prepararIntro(); }, 500);
  }catch(err){
    log("erro calibração", err);
    erro.textContent = "Não deu para aprender esse rótulo: " + (err.message || err) + ". Tente outra foto, mais de perto e sem reflexo.";
    erro.style.display = "block"; $("#btnFoto").style.display = "block"; $("#barra").style.display = "none"; $("#calibStatus").textContent = "";
  } finally { e.target.value = ""; }
};

/* ---------- Painel 3D (um por vinho, desenhado em canvas) ---------- */
async function fontesProntas(){
  try{ await Promise.race([Promise.all([document.fonts.load('500 120px "Cormorant Garamond"'), document.fonts.load('600 40px "Inter"'), document.fonts.load('400 40px "Inter"')]), new Promise(r => setTimeout(r, 2500))]); }catch(e){}
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function quebra(ctx, txt, maxW){ const p = txt.split(" "); const linhas = []; let l = ""; for (const w of p){ const t = l ? l + " " + w : w; if (ctx.measureText(t).width > maxW && l){ linhas.push(l); l = w; } else l = t; } if (l) linhas.push(l); return linhas; }
function desenharPainel(V){
  const W = 1024, H = 1400, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, V.cor[0]); g.addColorStop(1, V.cor[1]);
  rr(x, 8, 8, W-16, H-16, 64); x.fillStyle = g; x.globalAlpha = .97; x.fill(); x.globalAlpha = 1;
  x.lineWidth = 4; x.strokeStyle = "rgba(201,164,106,.85)"; x.stroke();
  x.fillStyle = "#c9a46a"; x.font = '600 34px Inter, sans-serif'; x.letterSpacing = "10px"; x.fillText(V.produtor.toUpperCase(), 80, 140);
  x.letterSpacing = "0px"; x.fillStyle = "#f4ece0"; x.font = '500 190px "Cormorant Garamond", Georgia, serif'; x.fillText(V.nome, 72, 320);
  x.font = '400 40px Inter, sans-serif'; x.globalAlpha = .85; x.fillText(V.sub, 80, 395); x.globalAlpha = 1;
  x.fillStyle = "rgba(201,164,106,.6)"; x.fillRect(80, 445, W-160, 3);
  let y = 540;
  V.painel.forEach(t => { x.fillStyle = "#c9a46a"; x.beginPath(); x.arc(102, y-14, 12, 0, Math.PI*2); x.fill(); x.fillStyle = "#f4ece0"; x.font = '500 52px Inter, sans-serif'; x.fillText(t, 140, y); y += 100; });
  x.fillStyle = "rgba(201,164,106,.6)"; x.fillRect(80, y-30, W-160, 3); y += 50;
  x.font = 'italic 500 50px "Cormorant Garamond", Georgia, serif'; x.fillStyle = "#f4ece0";
  quebra(x, V.notas.split(".")[0] + ".", W-160).slice(0, 3).forEach(l => { x.fillText(l, 80, y); y += 62; });
  x.font = '600 34px Inter, sans-serif'; x.fillStyle = "#c9a46a"; x.letterSpacing = "6px"; x.fillText("FICHA COMPLETA OU COMPRAR ↓", 80, H-80); x.letterSpacing = "0px";
  return c;
}

/* ---------- AR: vários rótulos, uma câmera ---------- */
let mind = null;
async function iniciarAR(pacote){
  mostrar("ar"); $("#statusTxt").textContent = "Iniciando câmera…";
  const url = URL.createObjectURL(new Blob([pacote.buf]));
  try{
    await fontesProntas();
    mind = new MindARThree({ container: $("#arContainer"), imageTargetSrc: url, maxTrack: 1, uiLoading: "no", uiScanning: "no", uiError: "no", filterMinCF: 0.0001, filterBeta: 0.003, missTolerance: 8 });
    const { renderer, scene, camera } = mind;
    const estados = pacote.chaves.map((k, i) => {
      const V = VINHOS[k], anchor = mind.addAnchor(i);
      const tex = new THREE.CanvasTexture(desenharPainel(V)); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
      const Lw = 0.82, Lh = Lw * 1400 / 1024;
      const painel = new THREE.Mesh(new THREE.PlaneGeometry(Lw, Lh), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
      const brilho = new THREE.Mesh(new THREE.PlaneGeometry(Lw * 1.08, Lh * 1.06), new THREE.MeshBasicMaterial({ color: 0xc9a46a, transparent: true, opacity: 0 }));
      brilho.position.z = -0.01;
      const grupo = new THREE.Group(); grupo.add(brilho, painel); grupo.scale.setScalar(0.001); anchor.group.add(grupo);
      const st = { k, grupo, brilho, visivel: false, t0: 0 };
      anchor.onTargetFound = () => {
        st.visivel = true; st.t0 = performance.now(); atual = k;
        $("#status").classList.add("achou"); $("#statusTxt").textContent = V.produtor + " " + V.nome + " reconhecido";
        $("#mira").style.opacity = 0; $("#btnFichaAR").classList.add("on"); $("#btnComprarAR").classList.add("on");
        $("#btnComprarAR").textContent = "Comprar " + V.nome;
        log("targetFound", k); if (navigator.vibrate) navigator.vibrate(30);
      };
      anchor.onTargetLost = () => {
        st.visivel = false; st.grupo.scale.setScalar(0.001); log("targetLost", k);
        if (!estados.some(s => s.visivel)){ $("#status").classList.remove("achou"); $("#statusTxt").textContent = "Aponte para um rótulo"; $("#mira").style.opacity = 1; }
      };
      return st;
    });
    await mind.start();
    $("#statusTxt").textContent = "Aponte para um rótulo"; log("AR iniciado", pacote.chaves.join(","));
    renderer.setAnimationLoop(() => {
      for (const s of estados){
        if (!s.visivel) continue;
        const t = (performance.now() - s.t0) / 1000, k = Math.min(1, t / 0.55), e = 1 - Math.pow(1 - k, 3);
        s.grupo.scale.setScalar(0.001 + e); s.grupo.position.z = 0.06 * e + Math.sin(t * 1.6) * 0.012;
        s.brilho.material.opacity = 0.25 + Math.sin(t * 2.2) * 0.12;
      }
      renderer.render(scene, camera);
    });
  }catch(err){
    log("erro AR", err); pararAR(); mostrar("intro"); prepararIntro();
    const el = $("#erroIntro"); el.style.display = "block";
    el.textContent = "Não consegui abrir a câmera (" + (err.message || err) + "). Confira a permissão de câmera e abra a página no Safari ou Chrome, não dentro de outro app.";
  }
}
function pararAR(){ try{ if (mind){ mind.renderer.setAnimationLoop(null); mind.stop(); } }catch(e){} mind = null; $("#arContainer").innerHTML = ""; $("#btnFichaAR").classList.remove("on"); $("#btnComprarAR").classList.remove("on"); $("#mira").style.opacity = 1; $("#status").classList.remove("achou"); }
$("#btnFechar").onclick = () => { pararAR(); mostrar("intro"); prepararIntro(); };
$("#btnFichaAR").onclick = () => abrirFicha(atual);
$("#btnComprarAR").onclick = () => comprar(atual);

/* ---------- Compra ---------- */
const params = new URLSearchParams(location.search);
function linkCompra(k){
  const base = CHECKOUT[k] || ""; if (!base) return "";
  try{
    const u = new URL(base);
    const utm = { utm_source: "gondola", utm_medium: "qr_ar", utm_campaign: params.get("secao") || "piloto_ficha_ar", utm_content: k };
    for (const [a, b] of Object.entries(utm)) if (!u.searchParams.has(a)) u.searchParams.set(a, b);
    return u.toString();
  }catch(e){ return base; }
}
function comprar(k){
  if (!k) return; const url = linkCompra(k);
  log("clique comprar", k, url || "(sem link)");
  if (url){ location.href = url; return; }
  abrirFicha(k); const av = $("#avisoCompra"); if (av) av.style.display = "block";
}

/* ---------- Ficha completa ---------- */
function abrirFicha(k){
  if (!k) return; const V = VINHOS[k];
  $("#folha").innerHTML = `
    <div class="selo">${V.produtor}</div>
    <h3>${V.nome}</h3>
    <p class="sub">${V.sub}</p>
    <div class="grade">${V.grade.map(([a,b]) => `<div><small>${a}</small><span>${b}</span></div>`).join("")}</div>
    <div class="bloco"><small>Notas de degustação</small><p>${V.notas}</p></div>
    <div class="bloco"><small>Harmonização</small><p>${V.harmoniza}</p></div>
    <div class="bloco"><p class="curio">${V.curio}</p></div>
    <button class="btn comprar" id="btnComprarFicha">Comprar ${V.nome}</button>
    <div class="aviso" id="avisoCompra">Piloto: o link de checkout deste vinho ainda não foi configurado. Na versão final, este botão leva direto para a página de compra.</div>
    <button class="btn prim voltar" id="btnFecharFicha">Voltar</button>`;
  $("#ficha").classList.add("on");
  $("#btnFecharFicha").onclick = () => $("#ficha").classList.remove("on");
  $("#btnComprarFicha").onclick = () => comprar(k);
}
$("#ficha").addEventListener("click", e => { if (e.target.id === "ficha") $("#ficha").classList.remove("on"); });
</script>
